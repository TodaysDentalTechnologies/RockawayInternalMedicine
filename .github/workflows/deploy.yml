# Builds the site and publishes it to S3 + CloudFront. See deploy/DEPLOY.md.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

# One deploy at a time. A deploy that has started finishes; the next one waits.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  BUCKET: rockawayinternalmedicine-site-310971188857
  DISTRIBUTION_ID: E2EN9X1JYKGDD9

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::310971188857:role/rockaway-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      # Hashed assets first, so new pages never point at files that aren't uploaded yet.
      - name: Upload hashed assets
        run: >
          aws s3 sync dist/_astro "s3://$BUCKET/_astro" --delete
          --cache-control "public,max-age=31536000,immutable"

      - name: Upload other files
        run: >
          aws s3 sync dist "s3://$BUCKET" --delete
          --exclude "_astro/*" --exclude "*.html" --exclude "amplify-custom-rules.json"
          --cache-control "public,max-age=3600"

      - name: Upload pages
        run: >
          aws s3 sync dist "s3://$BUCKET" --delete
          --exclude "*" --include "*.html"
          --cache-control "no-cache" --content-type "text/html; charset=utf-8"

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/*"
