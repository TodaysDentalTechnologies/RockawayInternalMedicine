    <title>Rockaway Internal Medicine | Primary Care Jamaica NY</title>
    <!-- description / canonical / OG / Twitter tags are injected per-route by
         scripts/prerender.mjs (marked data-rim-head) and kept in sync at runtime
         by src/components/Seo.tsx. Do NOT add static copies here — that is what
         caused duplicate meta description tags. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Non-blocking font load: media="print" defers CSS parsing off the critical
         path; onload swaps it to "all". <noscript> keeps fonts for no-JS visitors. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Manrope:wght@300..800&family=DM+Mono:wght@400;500&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Manrope:wght@300..800&family=DM+Mono:wght@400;500&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Manrope:wght@300..800&family=DM+Mono:wght@400;500&display=swap"
      />

    gtag('js', new Date());
    gtag('config', 'G-JTY9DG2180');
  </script>
</head>
